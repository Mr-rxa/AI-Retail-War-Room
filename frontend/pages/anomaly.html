<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anomaly Detection — AI Retail War Room</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">

<!-- GSAP + ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<!-- Lenis Smooth Scroll -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>
<body data-page="anomaly">

<div class="blob-wrap">
  <div class="blob blob-terracotta"></div>
  <div class="blob blob-sage"></div>
</div>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-col">
    <div id="navbarMount"></div>

    <main class="content">
      <div id="errorBanner" class="error-banner"></div>

      <div class="kpi-grid stagger-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
        <div class="kpi-card skeu-card tilt-card">
          <div class="kpi-top"><span class="kpi-label embossed-label">Total Outliers Detected</span><div class="kpi-icon terracotta"><i class="bi bi-search"></i></div></div>
          <div class="kpi-value" id="statTotal">0</div>
        </div>
        <div class="kpi-card skeu-card tilt-card">
          <div class="kpi-top"><span class="kpi-label embossed-label">Critical Revenue Anomalies</span><div class="kpi-icon amber"><i class="bi bi-exclamation-triangle-fill"></i></div></div>
          <div class="kpi-value" id="statCritical">0</div>
        </div>
        <div class="kpi-card skeu-card tilt-card">
          <div class="kpi-top"><span class="kpi-label embossed-label">Growth Opportunities</span><div class="kpi-icon sage"><i class="bi bi-shield-check"></i></div></div>
          <div class="kpi-value" id="statOpportunity">0</div>
        </div>
      </div>

      <div class="max-section-head reveal-up">
        <h2>IsolationForest Anomaly Intelligence</h2>
      </div>

      <div class="neuro-toggle reveal-up" style="margin-bottom:20px;">
        <button class="active" data-filter="all">All</button>
        <button data-filter="critical">Critical</button>
        <button data-filter="high">High</button>
        <button data-filter="opportunity">Opportunity</button>
        <button data-filter="info">Info</button>
      </div>

      <div id="anomalyCardList" class="stagger-grid"></div>

      <div id="footerMount"></div>
    </main>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/anomaly.js"></script>
<script src="../js/motion.js"></script>
<script src="../js/particles.js"></script>
<script src="../js/preloader.js"></script>
<script src="../js/command.js"></script>
</body>
</html>
