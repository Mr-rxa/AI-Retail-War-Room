<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Advisor Lab — AI Retail War Room</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">

<!-- GSAP + ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<!-- Lenis Smooth Scroll -->
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>
<body data-page="advisor">

<div class="blob-wrap">
  <div class="blob blob-terracotta"></div>
  <div class="blob blob-amber"></div>
</div>

<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-col">
    <div id="navbarMount"></div>

    <main class="content">
      <div id="errorBanner" class="error-banner"></div>

      <div class="panel reveal-up" style="margin-bottom:20px;">
        <div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div>
            <h3 style="margin:0 0 3px;font-size:16px;font-family:var(--font-heading);">AI Strategic Advisor &amp; Scenario Simulator</h3>
            <div style="font-size:12.5px;color:var(--text-muted);">Generative AI strategic reporting powered by Google Gemini API &amp; causal decision models.</div>
          </div>
          <div class="advisor-toolbar" style="display:flex;gap:8px;">
            <button class="btn-primary" id="generateBtn"><i class="bi bi-magic"></i>Generate Report</button>
            <button class="btn-outline btn-push" id="regenerateBtn"><i class="bi bi-arrow-clockwise"></i>Re-analyze</button>
            <button class="btn-outline btn-push" id="copyBtn" disabled><i class="bi bi-clipboard"></i>Copy Report</button>
            <button class="btn-outline btn-push" id="downloadBtn" disabled><i class="bi bi-download"></i>Export PDF</button>
          </div>
        </div>
      </div>

      <div class="advisor-report reveal-scale" id="reportContainer">
        <div class="advisor-empty" style="padding:48px;text-align:center;color:var(--text-muted);font-size:14px;"><i class="bi bi-stars" style="font-size:32px;color:var(--accent);display:block;margin-bottom:12px;"></i>Generating executive intelligence report…</div>
      </div>

      <div id="footerMount"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script src="../js/advisor.js"></script>
<script src="../js/motion.js"></script>
<script src="../js/particles.js"></script>
<script src="../js/preloader.js"></script>
<script src="../js/command.js"></script>
</body>
</html>
